name: gym-${SLOT}

services:
  backend:
    image: gym/backend:${BACKEND_TAG:-latest}
    container_name: gym-${SLOT}-backend
    build:
      context: /opt/gym/src/backend
    restart: always
    ports:
      - "127.0.0.1:${BE_PORT}:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://gym_user:${POSTGRES_PASSWORD}@gym-postgres:5432/gym_db
    env_file:
      - /etc/gym/backend.env
    networks:
      - gym-data
    security_opt:
      - "no-new-privileges:true"

  frontend:
    image: gym/frontend:${FRONTEND_TAG:-latest}
    container_name: gym-${SLOT}-frontend
    build:
      context: /opt/gym/src/frontend
    restart: always
    ports:
      - "127.0.0.1:${FE_PORT}:80"
    networks:
      - gym-data
    security_opt:
      - "no-new-privileges:true"

networks:
  gym-data:
    external: true
