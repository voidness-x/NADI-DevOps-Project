---
- name: Firewalld running
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Open assigned public ports
  ansible.posix.firewalld:
    zone: public
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - "{{ ssh_listen_port }}"
    - "{{ app_port }}"
    - "{{ admin_port }}"
